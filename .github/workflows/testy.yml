name: alza-scanner workflow

on:
  push:
    branches:
      - master

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
    - name: Stahni kod
      uses: actions/checkout@v3

    - name: Nastav Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.14.4"

    - name: Instaluj zavislosti
      run: pip install -r requirements.txt

    - name: Spust testy
      run: pytest

    - name: Spust kontrolu kodu
      run: flake8 src/

    - name: Kontrola
      run: echo "Něco se pokazilo"
      if: failure()

  build:
    runs-on: ubuntu-latest
    needs: testy
    steps:
    - name: Stahni kod
      uses: actions/checkout@v3

    - name: Sestav image
      run: docker build -t alza-scanner .
