name: alza-scanner workflow

on:
  push:
    branches:
      - master

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
    - name: Stahni kod
      uses: actions/checkout@v4

    - name: Nastav Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Instaluj zavislosti
      run: pip install -r requirements-dev.txt

    - name: Spust testy
      run: pytest

    - name: Spust kontrolu kodu
      run: flake8 .

  build:
    runs-on: ubuntu-latest
    needs: testy
    steps:
    - name: Stahni kod
      uses: actions/checkout@v4

    - name: Sestav image
      run: docker build -t alza-scanner .